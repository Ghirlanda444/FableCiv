; The custom template paths are filled in by .github/workflows/godot.yml from the GodotJS release.

[preset.0]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="../build/TinyEmpires.exe"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.0.options]

custom_template/debug=""
custom_template/release="@WIN_TEMPLATE@"
debug/export_console_wrapper=0
binary_format/embed_pck=true
binary_format/architecture="x86_64"
application/modify_resources=false
application/product_name="Tiny Empires"
application/file_description="Tiny Empires (Godot test build)"

[preset.1]

name="Android"
platform="Android"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="../build/TinyEmpires.apk"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.1.options]

custom_template/debug="@APK_DEBUG_TEMPLATE@"
custom_template/release="@APK_RELEASE_TEMPLATE@"
gradle_build/use_gradle_build=false
architectures/armeabi-v7a=false
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false
version/code=1
version/name="0.1-godot"
package/unique_name="com.tinyempires.godot"
package/name="Tiny Empires 3D"
package/signed=true
screen/immersive_mode=true
