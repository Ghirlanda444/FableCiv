name: Android release (Play Store)

# Signed release build: an .aab for Google Play and an .apk for direct install. Needs four repository secrets:
#   ANDROID_KEYSTORE_BASE64  the keystore file, base64-encoded   (base64 -w0 tiny-empires.jks)
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# Create the keystore once (keep it forever, Play only accepts updates signed with the same key):
#   keytool -genkeypair -v -keystore tiny-empires.jks -alias tinyempires -keyalg RSA -keysize 2048 -validity 10000
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version name shown in the store (e.g. 0.3.0)"
        required: false
        default: "0.3.0"
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: true

jobs:
  release:
    name: Build signed release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0 platform-tools"
      - run: yes | sdkmanager --licenses >/dev/null || true
      - uses: gradle/actions/setup-gradle@v3
      - name: Keystore from secrets
        id: ks
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"; echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"; echo "signed=true" >> "$GITHUB_OUTPUT"; else echo "No keystore secret: building an unsigned release (cannot be installed or uploaded)."; echo "signed=false" >> "$GITHUB_OUTPUT"; fi
      - name: Build
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.ks.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          APP_VERSION_NAME: ${{ github.event.inputs.version || github.ref_name }}
          APP_REMOTE_FIRST: "false"
        run: |
          export APP_VERSION_CODE=$(git rev-list --count HEAD)
          echo "versionCode $APP_VERSION_CODE, versionName $APP_VERSION_NAME"
          node tools/asset-manifest.js
          cd android && chmod +x gradlew
          ./gradlew --no-daemon bundleRelease assembleRelease
          ls -la app/build/outputs/bundle/release app/build/outputs/apk/release
      - name: Publish release build
        if: steps.ks.outputs.signed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-release
          name: "Tiny Empires (signed Android release)"
          prerelease: false
          files: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
          body: |
            Signed release build (versionCode from the commit count). Upload the .aab to Google Play; the .apk installs directly on a phone.
            Built from commit ${{ github.sha }}.
