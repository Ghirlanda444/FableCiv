name: Publish web version

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    # Enable GitHub Pages for the repository (Settings > Pages > Source: GitHub Actions), then set the
    # repository variable PAGES_ENABLED to "true" (Settings > Secrets and variables > Actions > Variables).
    if: ${{ vars.PAGES_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stamp the version
        run: |
          sed -i "s/__VERSION__/${GITHUB_SHA}/" web/sw.js web/js/version.js
          node tools/asset-manifest.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
