name: Translate texts

on:
  workflow_dispatch:
    inputs:
      langs:
        description: "Languages to translate (comma-separated codes; empty = all: it,es,de,fr,nl,zh,ru,bg)"
        required: false
        default: ""
      limit:
        description: "Maximum missing strings per language this run (0 = all)"
        required: false
        default: "0"

permissions:
  contents: write

concurrency:
  group: translate
  cancel-in-progress: false

jobs:
  translate:
    name: Translate missing strings with Grok
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Extract the English strings
        run: node tools/i18n-extract.js
      - name: Translate
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          XAI_TEXT_MODEL: ${{ vars.XAI_TEXT_MODEL }}
        run: |
          git config user.name "fableciv-art-bot"
          git config user.email "art-bot@users.noreply.github.com"
          langs="${{ github.event.inputs.langs }}"; limit="${{ github.event.inputs.limit }}"
          [ -z "$langs" ] && langs="it,es,de,fr,nl,zh,ru,bg"
          # one language at a time, committed and pushed as soon as it is done, so a long run leaves nothing behind if it stops
          for lang in $(echo "$langs" | tr ',' ' '); do
            python3 tools/translate.py --langs "$lang" --limit "${limit:-0}" || echo "translation of $lang stopped with an error"
            git add web/i18n
            git commit -q -m "Translations: $lang ($(python3 -c "import json;print(len(json.load(open('web/i18n/$lang.json'))))" 2>/dev/null || echo 0) of $(python3 -c "import json;print(len(json.load(open('web/i18n/keys.json'))))") strings) [skip ci]" || echo "nothing new for $lang"
            git pull --rebase -q origin main || true
            git push -q origin HEAD:main || true
          done
