name: Generate artwork

on:
  workflow_dispatch:
    inputs:
      kinds:
        description: "Comma-separated kinds to generate (terrain,features,units,leaders,buildings,wonders,national,natural,resources,civs,techs,civics). Empty = all."
        required: false
        default: ""
      limit:
        description: "Maximum number of pictures this run (0 = all missing)"
        required: false
        default: "0"
      provider:
        description: "Image generator: pollinations (free) or xai (Grok Imagine, uses the XAI_API_KEY secret)"
        required: false
        default: "pollinations"
      skip:
        description: "Kind prefixes to leave out unless named in kinds (default: the per-culture unit/building variants; write none to generate everything)"
        required: false
        default: "units/,buildings/"

permissions:
  contents: write
  actions: write

concurrency:
  group: artwork
  cancel-in-progress: false

jobs:
  generate:
    name: Generate missing pictures
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install background removal
        run: |
          python -m pip install --upgrade pip
          pip install pillow "rembg[cpu]" onnxruntime
      - name: Generate (commits progress every batch)
        env:
          KINDS: ${{ github.event.inputs.kinds }}
          LIMIT: ${{ github.event.inputs.limit }}
          ART_PROVIDER: ${{ github.event.inputs.provider }}
          SKIP_KINDS: ${{ github.event.inputs.skip }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          XAI_IMAGE_MODEL: ${{ vars.XAI_IMAGE_MODEL }}
        run: |
          git config user.name "fableciv-art-bot"
          git config user.email "art-bot@users.noreply.github.com"
          limit=${LIMIT:-0}; remaining=$limit
          for batch in $(seq 1 80); do
            if [ "$limit" != "0" ] && [ "$remaining" -le 0 ]; then break; fi
            step=12
            if [ "$limit" != "0" ] && [ "$remaining" -lt 12 ]; then step=$remaining; fi
            before=$(find web/assets -type f \( -name '*.png' -o -name '*.jpg' \) | wc -l)
            python3 tools/gen-art.py --limit $step --kinds "$KINDS" || true
            after=$(find web/assets -type f \( -name '*.png' -o -name '*.jpg' \) | wc -l)
            if [ "$after" -gt "$before" ]; then
              git add web/assets
              git commit -q -m "Artwork: $((after-before)) generated pictures (total $after) [skip ci]" || true
              git pull --rebase -q origin main || true
              git push -q origin HEAD:main || true
            fi
            if [ "$after" -eq "$before" ]; then echo "no new pictures in this batch, stopping"; break; fi
            if [ "$limit" != "0" ]; then remaining=$((remaining-step)); fi
          done
          echo "pictures now: $(find web/assets -type f \( -name '*.png' -o -name '*.jpg' \) | wc -l)"
          git pull --rebase -q origin main || true
          git commit --allow-empty -q -m "Artwork: rebuild apps with $(find web/assets -type f \( -name '*.png' -o -name '*.jpg' \) | wc -l) pictures" && git push -q origin HEAD:main || true
      - name: Rebuild the apps with the new artwork
        # pushes made with the workflow token do not start other workflows, so dispatch them explicitly
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run android.yml --ref main || true
          gh workflow run windows.yml --ref main || true
