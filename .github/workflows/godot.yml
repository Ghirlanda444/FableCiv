name: Godot build

# Godot test build (godot/): runs the rules engine headless, takes a screenshot, exports Windows + Android,
# and publishes them as the godot-latest pre-release. The web game and its builds are untouched.
on:
  push:
    paths: ['godot/**', 'tools/godot/**', '.github/workflows/godot.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency: # a newer push replaces a running build, so an older build can never publish over a newer one
  group: godot-build-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOTJS_TAG: v1.1.0.beta1-4.6.1
  GODOT_VER: 4.6.1

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Bundle the rules engine and check the map geometry
        run: |
          node tools/godot/bundle.js
          node tools/godot/test-geo.js

      - name: Download GodotJS (Godot ${{ env.GODOT_VER }} + V8) editor and export templates
        timeout-minutes: 12
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          mkdir -p ~/gjs && cd ~/gjs
          for f in linux-editor windows-template_release android-template_release android-template_debug; do
            for try in 1 2 3; do # a stalled download is retried rather than hanging the build
              rm -f "$f-$GODOT_VER-v8.zip"; timeout 180 gh release download "$GODOTJS_TAG" -R godotjs/GodotJS -p "$f-$GODOT_VER-v8.zip" && break
              echo "download of $f failed or stalled (try $try)"; sleep 5
            done
            [ -f "$f-$GODOT_VER-v8.zip" ] || { gh release view "$GODOTJS_TAG" -R godotjs/GodotJS --json assets --jq '.assets[].name'; exit 1; }
            mkdir -p "$f" && unzip -q "$f-$GODOT_VER-v8.zip" -d "$f"
          done
          find ~/gjs -type f -not -name '*.zip' | sed "s|$HOME/gjs/||" | head -60
          GODOT=$(find ~/gjs/linux-editor -type f \( -name '*linux*' -o -name '*godot*' \) -not -name '*.so' | head -1)
          chmod +x "$GODOT"; echo "GODOT=$GODOT" >> "$GITHUB_ENV"
          echo "WIN_TEMPLATE=$(find ~/gjs/windows-template_release -name '*.exe' -not -name '*console*' | head -1)" >> "$GITHUB_ENV"
          echo "APK_RELEASE=$(find ~/gjs/android-template_release -name '*.apk' | head -1)" >> "$GITHUB_ENV"
          echo "APK_DEBUG=$(find ~/gjs/android-template_debug -name '*.apk' | head -1)" >> "$GITHUB_ENV"

      - name: Import the project under a virtual display (headless import crashed on 3D models before)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq mesa-vulkan-drivers xvfb > /dev/null
          "$GODOT" --version
          for attempt in 1 2 3; do
            timeout 600 xvfb-run -a -s "-screen 0 1280x720x24" "$GODOT" --path godot --import 2>&1 | grep -v "^ALSA" | grep -iE "error|crash|signal|DONE.*import$" | tail -15 || true
            missing=$(cd godot && for f in $(find assets -name '*.gltf' -o -name '*.glb'); do [ -f "$f.import" ] && grep -q '^path=' "$f.import" && [ -f "$(grep -m1 '^path=' "$f.import" | sed 's|path="res://||; s|"$||')" ] || echo "$f"; done)
            [ -z "$missing" ] && { echo "all models imported (attempt $attempt)"; break; }
            echo "attempt $attempt: $(echo "$missing" | wc -l) models not imported yet: $(echo $missing | head -c 300)"
          done
          ls godot/.godot/imported | grep -ciE "\.scn$" || true
      - name: Smoke test (40 AI turns headless)
        run: |
          timeout 240 "$GODOT" --headless --path godot -- --smoke 2>&1 | tee smoke.log | tail -60 || true
          grep -q "SMOKE OK" smoke.log
          grep -q "art: painted pictures" smoke.log || { echo "the painted unit and building pictures failed to load (the build would show placeholders)"; exit 1; }

      - name: Screenshot (software Vulkan)
        continue-on-error: true
        run: |
          mkdir -p build
          timeout 400 xvfb-run -a -s "-screen 0 1280x720x24" "$GODOT" --path godot --resolution 1280x720 -- --shot 2>&1 | grep -v "^ALSA" | tee shot.log | tail -40
          D="$HOME/.local/share/godot/app_userdata/Tiny Empires"
          cp "$D/shot.png" build/screenshot.png; cp "$D/shot_wide.png" build/screenshot-wide.png || true; cp "$D/shot_close.png" build/screenshot-close.png || true; cp "$D/shot_low.png" build/screenshot-low.png || true; cp "$D/shot_relief.png" build/screenshot-relief.png || true; cp "$D/shot_city.png" build/screenshot-city.png || true
          ls -la build

      - name: Check that every shader compiled (a broken shader silently renders plain white)
        run: |
          [ -f shot.log ] || { echo "no screenshot log"; exit 1; }
          if grep -iq "shader error\|SHADER_ERROR\|shader compilation failed" shot.log; then grep -i -B2 -A10 "shader error" shot.log | head -80; exit 1; fi
          echo "shaders ok"

      - name: Export Windows
        run: |
          mkdir -p build
          sed -i "s|@WIN_TEMPLATE@|$WIN_TEMPLATE|; s|@APK_DEBUG_TEMPLATE@|$APK_DEBUG|; s|@APK_RELEASE_TEMPLATE@|$APK_RELEASE|" godot/export_presets.cfg
          xvfb-run -a -s "-screen 0 1280x720x24" "$GODOT" --path godot --export-release "Windows Desktop" ../build/TinyEmpires.exe 2>&1 | grep -v "^ALSA\|LWS" | tail -30
          ls -la build/TinyEmpires.exe

      - name: Export Android
        run: |
          keytool -genkeypair -v -keystore ~/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -validity 10000 -dname "CN=Android Debug,O=Android,C=US" > /dev/null 2>&1
          mkdir -p ~/.config/godot
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\nexport/android/debug_keystore = "%s"\nexport/android/debug_keystore_user = "androiddebugkey"\nexport/android/debug_keystore_pass = "android"\n' \
            "$ANDROID_HOME" "$JAVA_HOME_17_X64" "$HOME/debug.keystore" > ~/.config/godot/editor_settings-4.6.tres
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$HOME/debug.keystore" GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android
          xvfb-run -a -s "-screen 0 1280x720x24" "$GODOT" --path godot --export-debug "Android" ../build/TinyEmpires.apk 2>&1 | grep -v "^ALSA\|LWS\|ADDING" | tail -30
          ls -la build/TinyEmpires.apk

      - name: Recreate the release (stale hidden assets block uploads)
        if: github.ref == 'refs/heads/v2-divergence' || github.ref == 'refs/heads/main'
        env: { GH_TOKEN: '${{ github.token }}' }
        run: gh release delete godot-latest --cleanup-tag -y --repo "${{ github.repository }}" || true

      - name: Publish the godot-latest pre-release
        if: github.ref == 'refs/heads/v2-divergence' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: godot-latest
          name: Tiny Empires 3D (Godot test build)
          prerelease: true
          target_commitish: ${{ github.sha }}
          body: |
            Godot test build of Tiny Empires: the same rules engine as the web game in a 3D hex world. All empires are AI-run: press End Turn (or Space) or Auto to watch. FX toggles ambient occlusion.
            Windows: download TinyEmpires.exe and run it. Android: install TinyEmpires.apk (allow installs from unknown sources).
            Built from ${{ github.sha }}.
          files: |
            build/TinyEmpires.exe
            build/TinyEmpires.apk
            build/screenshot.png
            build/screenshot-wide.png
            build/screenshot-close.png
            build/screenshot-low.png
            build/screenshot-relief.png
            build/screenshot-city.png
          fail_on_unmatched_files: false

      - name: Make sure the release is public (GitHub sometimes leaves it as a draft, and drafts cannot be downloaded)
        if: github.ref == 'refs/heads/v2-divergence' || github.ref == 'refs/heads/main'
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          for try in 1 2 3 4 5; do
            draft=$(gh release view godot-latest --repo "${{ github.repository }}" --json isDraft --jq .isDraft || echo missing)
            echo "attempt $try: draft=$draft"
            [ "$draft" = "false" ] && { gh release view godot-latest --repo "${{ github.repository }}" --json assets --jq '.assets[].name'; exit 0; }
            gh release edit godot-latest --repo "${{ github.repository }}" --draft=false --prerelease || true
            sleep 5
          done
          echo "::error::the godot-latest release is still not public"; exit 1
