name: Windows app

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Windows exe and single-file HTML
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Single-file HTML
        run: node tools/bundle-html.js Chibilization.html
      - name: Prepare desktop app
        shell: bash
        run: |
          node tools/make-icon.js desktop/icon.ico
          rm -rf desktop/web && cp -r web desktop/web
          cd desktop && npm install --no-audit --no-fund
      - name: Build portable exe
        shell: bash
        run: cd desktop && npx electron-builder --win portable --x64 --publish never
      - name: Remove previous release assets (upload fails if a stale copy remains)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete-asset windows-latest "Chibilization-windows.exe" -y --repo "${{ github.repository }}" || true
          gh release delete-asset windows-latest "Chibilization.html" -y --repo "${{ github.repository }}" || true
      - name: Publish latest Windows pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-latest
          name: "Chibilization (latest Windows build)"
          prerelease: true
          files: |
            desktop/dist/Chibilization-windows.exe
            Chibilization.html
          body: |
            Chibilization-windows.exe: portable Windows app, no install (double-click; Windows SmartScreen may ask you to confirm the first time because it is unsigned).
            Chibilization.html: the whole game in one file, opens in any modern browser on Windows, Mac or Linux.
            Built from commit ${{ github.sha }}.
