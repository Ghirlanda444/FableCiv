<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0e14">
<title>Chibilization</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-512.png">
<link rel="apple-touch-icon" href="icon-512.png">
</head>
<body>
<div id="title" class="screen">
  <canvas id="title-bg"></canvas>
  <img id="title-art" class="title-art" alt="" hidden>
  <div class="title-shade"></div>
  <button id="btn-music" class="icon music-btn" title="Music">🎵</button>
  <div class="title-inner">
    <h1 class="logo"><img id="logo-img" class="logo-img" alt="Chibilization" hidden><span class="logo-text" aria-hidden="true"><span class="logo-w1">Chibi</span><span class="logo-w2">lization</span></span></h1>
    <p class="tagline">Build a civilization that never resets. Towns, cities, wonders and war across eight eras.</p>
    <div class="title-buttons">
      <button id="btn-continue" class="big primary" hidden>Continue</button>
      <button id="btn-new" class="big primary">New Game</button>
      <button id="btn-help" class="big ghost">How to Play</button>
      <button id="btn-pedia" class="big ghost">📖 Civilopedia</button>
    </div>
    <p class="version" id="version-line">Chibilization · single-player</p>
  </div>
</div>

<div id="setup" class="screen" hidden>
  <div class="setup-inner">
    <h2>Choose your civilization</h2>
    <p class="hint">Each leader rules only their own people. The bonuses below stay with you for the whole game.</p>
    <div id="civ-grid" class="civ-grid"></div>
    <div id="civ-detail" class="civ-detail"></div>
    <div class="setup-options">
      <label>Map size <select id="opt-size"></select></label>
      <label>Map type <select id="opt-type"></select></label>
      <label>Game speed <select id="opt-speed"></select></label>
      <label>Opponents <select id="opt-civs"></select></label>
      <label>City-states <select id="opt-states"></select></label>
      <label>Difficulty <select id="opt-diff"></select></label>
      <label>Seed <input id="opt-seed" type="number" placeholder="random"></label>
    </div>
    <div class="title-buttons">
      <button id="btn-start" class="big primary">Start Game</button>
      <button id="btn-back" class="big ghost">Back</button>
    </div>
  </div>
</div>

<div id="game" class="screen" hidden>
  <canvas id="map"></canvas>
  <div id="topbar">
    <button id="btn-menu" class="icon" title="Menu">☰</button>
    <button id="btn-pedia-top" class="icon" title="Civilopedia">📖</button>
    <div id="top-yields"></div>
    <div id="top-turn"></div>
  </div>
  <div id="notifs"></div>
  <div id="bottombar">
    <div id="context"></div>
    <div id="turn-controls">
      <button id="btn-next" class="turn">Next Unit</button>
      <button id="btn-end" class="turn primary">End Turn</button>
      <button id="btn-pass" class="turn pass" hidden>Pass ▶</button>
    </div>
  </div>
  <div id="toast" hidden></div>
  <div id="tip" class="tip" hidden></div>
  <div id="quote" class="confirm" hidden><div class="quote-box"><img id="quote-art" class="quote-art" alt="" hidden><div id="quote-kicker" class="quote-kicker"></div><h2 id="quote-title"></h2><p id="quote-text"></p><div id="quote-by" class="quote-by"></div><div class="confirm-buttons"><button id="quote-ok" class="primary">Continue</button></div></div></div>
  <div id="leader" class="confirm" hidden><div class="leader-box"><div class="leader-head"><img id="leader-art" class="leader-art" alt="" hidden><div class="leader-id"><div id="leader-kicker" class="quote-kicker"></div><h2 id="leader-name"></h2><div id="leader-sub" class="leader-sub"></div></div></div><p id="leader-say" class="leader-say"></p><div id="leader-info" class="leader-info"></div><div id="leader-actions" class="leader-actions"></div><div class="confirm-buttons"><button id="leader-close">Close</button></div></div></div>
  <div id="confirm" class="confirm" hidden><div class="confirm-box"><p id="confirm-text"></p><div class="confirm-buttons"><button id="confirm-no">Cancel</button><button id="confirm-yes" class="primary">Confirm</button></div></div></div>
  <div id="panel" class="panel" hidden>
    <div class="panel-head"><h2 id="panel-title"></h2><button id="panel-close" class="icon">✕</button></div>
    <div id="panel-body" class="panel-body"></div>
  </div>
</div>

<script src="js/version.js"></script>
<script src="js/assetlist.js"></script>
<script src="js/core/rng.js"></script>
<script src="js/ui/assets.js"></script>
<script src="js/core/hex.js"></script>
<script src="js/data/terrain.js"></script>
<script src="js/data/civs.js"></script>
<script src="js/data/civs2.js"></script>
<script src="js/data/religion.js"></script>
<script src="js/data/citystates.js"></script>
<script src="js/data/cultures.js"></script>
<script src="js/data/palace.js"></script>
<script src="js/data/greatpeople.js"></script>
<script src="js/data/units.js"></script>
<script src="js/data/buildings.js"></script>
<script src="js/data/techs.js"></script>
<script src="js/data/quotes.js"></script>
<script src="js/core/mapgen.js"></script>
<script src="js/core/game.js"></script>
<script src="js/core/units.js"></script>
<script src="js/core/religion.js"></script>
<script src="js/core/citystates.js"></script>
<script src="js/core/diplomacy.js"></script>
<script src="js/core/palace.js"></script>
<script src="js/core/greatpeople.js"></script>
<script src="js/core/ai.js"></script>
<script src="lib/three.min.js"></script>
<script src="js/ui/renderer.js"></script>
<script src="js/ui/renderer3d.js"></script>
<script src="js/ui/panels.js"></script>
<script src="js/ui/tree.js"></script>
<script src="js/ui/audio.js"></script>
<script src="js/ui/diplo.js"></script>
<script src="js/ui/palace.js"></script>
<script src="js/ui/pedia.js"></script>
<script src="js/ui/cityview.js"></script>
<script src="js/ui/citymap.js"></script>
<script src="js/ui/app.js"></script>
</body>
</html>
